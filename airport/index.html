<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>공항 미팅 — ARBA 투어지침서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--red:#BE1E2D;--fg:#1C1716;--mut:#6B6360;--line:#E7E1DE;--bg:#FAF7F5;--card:#fff;--green:#1F7A4D;--warn:#FFF1F2;--blue:#1A5FD0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;gap:10px;margin-bottom:4px}
header .dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}
header h1{font-size:20px;margin:0;font-weight:800}
.sub{color:var(--mut);font-size:14px;margin:0 0 16px}
h2{font-size:13px;letter-spacing:.12em;color:var(--red);font-weight:800;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.fl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.fl b{font-size:22px;letter-spacing:.02em}
.tag{font-size:12px;font-weight:800;border-radius:6px;padding:2px 8px;background:#F1EEEC;color:#4b4442}
.tag.t{background:var(--red);color:#fff}
.when{font-size:15px;margin:4px 0 10px}
.btn{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:10px;font-weight:700;font-size:15px;text-decoration:none;margin-top:8px;padding:8px 12px;text-align:center}
.btn.live{background:var(--red);color:#fff}
.btn.sec{background:#fff;color:var(--fg);border:1px solid var(--line)}
.hint{font-size:12.5px;color:var(--mut);margin:6px 2px 0;line-height:1.5}
ul{margin:0;padding-left:18px;display:grid;gap:7px;font-size:14.5px;line-height:1.55}
li::marker{color:var(--red)}
.warn{background:var(--warn);border-color:#F3C9CE}
.exits{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.exits span{font-weight:800;font-size:15px;border:1.5px solid var(--fg);border-radius:8px;min-width:34px;text-align:center;padding:4px 0}
.foot{font-size:12px;color:var(--mut);margin-top:18px}
</style></head>
<body><div class="wrap">
<header><span class="dot"></span><h1 id="h1"></h1></header>
<p class="sub" id="sub"></p>
<div id="app"></div>
<p class="foot" id="foot"></p>
</div>
<script>
(function(){
  var P=new URLSearchParams(location.search), EN=(P.get('lang')||'')==='en';
  var PT=(P.get('k')||'JT').toUpperCase()==='PT', trip=P.get('t')||'';
  // f = 편명|YYYY-MM-DD|HH:MM|구분(in/out)|공항(ICN/CJU/PUS), 여러 편이면 ~ 로 구분
  var F=(P.get('f')||'').split('~').filter(Boolean).map(function(x){var a=x.split('|');return {no:a[0],d:a[1],tm:a[2]||'',dir:a[3]||'in',ap:(a[4]||'ICN').toUpperCase()}});
  // 인천공항 터미널 (2026-11 확인: 말레이시아항공·캐세이·바틱에어·에어아시아·스쿠트·싱가포르항공 = T1 / 대한항공·아시아나·진에어 등 = T2) — 실시간 화면에서 꼭 다시 확인
  var T2=['KE','OZ','LJ','BX','RS','DL','AF','KL'];
  function term(no){var c=no.slice(0,2).toUpperCase();return T2.indexOf(c)>=0?'T2':'T1';}
  var L=EN?{h1:'Airport meeting · live arrivals',fl:'FLIGHTS',in:'Arrival',out:'Departure',term:'Terminal',live:'Incheon arrivals (exit · belt · status)',liveOut:'Incheon Airport departures',track:'Live flight tracking (delay)',
      liveHint:'On the airport page, type the flight number in the search box. The "Arrival exit" column shows which exit (A–F) the guests will come out of — it is assigned on the day.',
      rule:'HOW TO MEET (JT · PT)',r:['Wait right in front of the exit shown for the flight, holding the airport sign, before the guests come out.','Find the exit on the live page or the big arrival board in front of the arrival hall. Terminal 1 exits A–F, Terminal 2 exits A–B.','Do not ask guests to come to another gate or door number to meet you — if they leave by another exit, you can miss each other.'],
      ex:'Exceptions (only these)',exl:['Guests arrive very early (e.g. 00:40) and rest at the airport before a later pick-up — agree the meeting point with them the day before.','Combined tour where a few guests are on a different flight (e.g. 2 people on AirAsia) — you may ask that small group to come and join the main group at the main group\'s exit.'],
      pk:'PARKING (PT driving guide)',pkl:['If you come late, the spaces near the exit are gone and you may have to park far away. Arrive early and park in the short-term car park closest to the guests\' exit.','Terminal 1 short-term car park: ground floor and B1–B3, in front of the terminal (height limit 2.1 m — Staria and Carnival fit).','Use the short-term car park, not the long-term one (long-term needs a shuttle bus).'],
      dl:'IF THE FLIGHT IS DELAYED',dll:['Tell the company on KakaoTalk (ARBA Travel Korea channel) right away — even at night or early morning.','Call the driver / call-van driver to move the time, and move the gimbap delivery time if there is one.','The company also checks flight status automatically about 3 hours before arrival and messages you if there is a delay of 30 minutes or more.'],
      foot:'ARBA Travel Korea · information on the airport page can change on the day — always check the live page.'}
    :{h1:'공항 미팅 · 실시간 도착 정보',fl:'항공편',in:'입국',out:'출국',term:'터미널',live:'인천공항 도착편 조회 (출구·벨트·현황)',liveOut:'인천공항 출발편 조회',track:'실시간 항공편 추적 (연착 확인)',
      liveHint:'인천공항 페이지에서 편명을 검색하세요. "입국장 출구" 칸에 손님이 나오는 출구(A~F)가 나옵니다 — 출구는 당일에 정해집니다.',
      rule:'미팅 원칙 (JT · PT 공통)',r:['손님이 나오기 전까지 그 항공편 출구 바로 앞에서 공항 피켓을 들고 기다려주세요.','출구는 위 실시간 페이지나 입국장 앞 대형 도착 안내판에서 확인합니다. 제1터미널 출구 A~F, 제2터미널 출구 A~B.','손님을 다른 게이트·문 번호로 오라고 하지 마세요. 손님이 다른 출구로 나오면 서로 못 만날 수 있습니다.'],
      ex:'예외 (이 경우만)',exl:['손님이 아주 이른 시간(예: 00:40)에 도착해 공항에서 쉬다가 나중에 만나는 경우 — 만날 장소를 전날 손님과 정해주세요.','합류 투어에서 소규모 인원만 항공편이 다른 경우(예: 2명만 에어아시아) — 그 인원에게 본 단체 출구로 와서 합류하라고 안내해도 됩니다.'],
      pk:'주차 (PT 드라이빙 가이드)',pkl:['늦게 오면 출구 가까운 자리가 없어 멀리 주차해야 할 수 있습니다. 여유 있게 와서 손님이 나오는 출구에서 가장 가까운 단기주차장에 주차해주세요.','제1터미널 단기주차장: 터미널 바로 앞 지상 1층·지하 1~3층 (높이 제한 2.1m — 스타리아·카니발 가능).','장기주차장은 셔틀버스를 타야 하니 쓰지 말고 단기주차장을 이용해주세요.'],
      dl:'연착되면',dll:['회사 비즈카톡(ARBA Travel Korea 채널)으로 바로 알려주세요 — 밤이나 새벽이라도 알려주세요.','기사님·콜밴 기사님께 연락해 시간을 다시 맞추고, 김밥 배달이 있으면 배달 시간도 바꿔주세요.','회사도 도착 약 3시간 전에 항공편을 자동으로 확인해, 30분 이상 늦으면 가이드님께 비즈카톡으로 알려드립니다.'],
      foot:'ARBA Travel Korea · 공항 정보는 당일 바뀔 수 있으니 꼭 실시간 페이지로 확인해주세요.'};
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
  document.documentElement.lang=EN?'en':'ko'; document.title=L.h1+' — ARBA';
  document.getElementById('h1').textContent=L.h1; document.getElementById('sub').textContent=trip;
  var h='<h2>'+L.fl+'</h2>';
  F.forEach(function(f){
    var m=f.no.match(/^([A-Z0-9]{2})(\d+)$/i), cc=m?m[1].toUpperCase():'', num=m?m[2]:'', ymd=(f.d||'').split('-');
    var fs='https://www.flightstats.com/v2/flight-tracker/'+cc+'/'+num+(ymd.length===3?'?year='+ymd[0]+'&month='+(+ymd[1])+'&date='+(+ymd[2]):'');
    var icn=f.ap==='ICN', tm=icn?term(f.no):'';
    h+='<div class="card"><div class="fl"><b>'+esc(f.no)+'</b><span><span class="tag">'+(f.dir==='out'?L.out:L.in)+'</span> '+(tm?'<span class="tag t">'+L.term+' '+tm+'</span>':'')+'</span></div>'+
      '<div class="when">'+esc(f.d)+' '+esc(f.tm)+' '+esc(f.ap)+'</div>'+
      (icn?'<a class="btn live" target="_blank" rel="noopener" href="https://www.airport.kr/ap_ko/'+(f.dir==='out'?'871':'872')+'/subview.do">'+(f.dir==='out'?L.liveOut:L.live)+'</a>':'')+
      '<a class="btn sec" target="_blank" rel="noopener" href="'+fs+'">'+L.track+'</a>'+
      (icn&&f.dir!=='out'?'<p class="hint">'+L.liveHint+'</p><div class="exits">'+(tm==='T2'?'<span>A</span><span>B</span>':'<span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span>')+'</div>':'')+'</div>';
  });
  if(PT) h+='<h2>'+L.pk+'</h2><div class="card"><ul>'+L.pkl.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>';
  document.getElementById('app').innerHTML=h; document.getElementById('foot').textContent=L.foot;
})();
</script>
</body></html>
